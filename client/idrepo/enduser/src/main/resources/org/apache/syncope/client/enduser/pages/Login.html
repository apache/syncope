<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta charset="UTF-8"/>
    <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'/>

    <title>Apache Syncope - Login</title>

    <link rel="shortcut icon" href="ui-commons/img/favicon.png" type="image/png"/>

    <link href="webjars/font-awesome/${font-awesome.version}/css/all.min.css" rel="stylesheet" type="text/css"/>
    <link href="webjars/ionicons/${ionicons.version}/css/ionicons.min.css" rel="stylesheet" type="text/css"/>
    <link href="ui-commons/css/fonts.css" rel="stylesheet" type="text/css"/>

    <link href="ui-commons/css/login.css" rel="stylesheet" type="text/css"/>
    <link href="ui-commons/css/syncopeUI.css" rel="stylesheet" type="text/css"/>
    <link href="css/syncopeEnduser.css" rel="stylesheet" type="text/css"/>

    <!-- accessibility -->
    <link href="ui-commons/css/accessibility.css" rel="stylesheet" type="text/css"/>
    <script type="text/javascript" src="ui-commons/js/accessibility.js"></script>
  </head>

  <body class="login-body">
    <div id="accessibility">
      <div id="change_theme">
        <div class="btn-accessibility"
             data-bs-theme-value="light">
          <i aria-label="Switch to light theme"
             accesskey="L"
             class="fa fa-sun">
          </i>
        </div>

        <div class="btn-accessibility"
             data-bs-theme-value="dark">
          <i aria-label="Switch to dark theme"
             accesskey="D"
             class="fa fa-moon">
          </i>
        </div>

        <div class="btn-accessibility"
             data-bs-theme-value="auto">
          <i aria-label="Switch to automatic theme"
             accesskey="A"
             class="fa fa-adjust">
          </i>
        </div>
      </div>

      <div id="change_fontSize" class="btn-accessibility">
        <i aria-label="Toggle font size increment"
           tabindex="1"
           accesskey="S"
           class="fa fa-font">
        </i>
      </div>
    </div>

    <script>
      $(function () {
        const $themeButtons = $('#change_theme [data-bs-theme-value]');

        function updateThemeButton(theme) {
          $themeButtons.hide();

          const nextTheme = {
            auto: 'light',
            light: 'dark',
            dark: 'auto'
          }[theme] || 'light';

          const $button = $themeButtons.filter(`[data-bs-theme-value="${nextTheme}"]`);

          $button.show();
        }

        document.addEventListener('changed.lte.color-mode', function (event) {
          updateThemeButton(event.detail.theme);
        });

        const currentTheme = localStorage.getItem('lte-theme') || 'auto';
        updateThemeButton(currentTheme);
      });
    </script>

    <div class="container">
      <div class="login-card card card-container">
        <div class="login-logo">
          <img class="login-logo-light"
               src="ui-commons/img/logo-green.png"
               alt="Apache Syncope"/>

          <img class="login-logo-dark"
               src="ui-commons/img/logo.png"
               alt="Apache Syncope"/>
        </div>

        <span wicket:id="feedback" role="alert"/>

        <form class="form-signin" wicket:id="login">
          <fieldset class="form-group">
            <input type="text" wicket:id="username" class="form-control"
                   wicket:message="placeholder:username" required="required" autofocus="autofocus"/>

            <div class="input-group d-flex">
              <input type="password" class="form-control w-75" wicket:id="password"
                     wicket:message="placeholder:password" required="required"/>
              <button type="button" class="btn btn-warning btn-flat input-group-text w-auto m-0 h-100" onclick="
                var input = $(this).prevAll('input');
                var type = input.attr('type');
                var children = $(this).children();
                if (type !== 'text') {
                  $(input).attr('type', 'text');
                  $(children).addClass('fa-eye-slash').removeClass('fa-eye');
                } else {
                  $(input).attr('type', 'password');
                  $(children).removeClass('fa-eye-slash').addClass('fa-eye');
                }
                return false;">
                <i class="fa fa-eye"></i>
              </button>
            </div>

            <input type="text" wicket:id="mfa" class="form-control" placeholder="mfa"/>

            <div class="mb-3">
              <select class="form-control form-select select2bs4 select2-hidden-accessible" wicket:id="language"/>
            </div>

            <div class="mb-3">
              <select class="form-control form-select select2bs4 select2-hidden-accessible" wicket:id="domain"/>
            </div>

            <button wicket:id="submit" type="submit" class="btn btn-lg btn-primary btn-block btn-signin bg-red"></button>
          </fieldset>

          <div wicket:id="ssoLogins">
            <div wicket:id="ssoLogin"/>
          </div>
        </form>

        <div class="text-center login_link">
          <a wicket:id="self-pwd-reset"><wicket:message key="self-pwd-reset">[SELFPWDRESET]</wicket:message></a><br/>
          <a wicket:id="self-registration"><wicket:message key="self-registration">[SELFREGISTRATION]</wicket:message></a>
        </div>
      </div>
    </div>
  </body>
</html>
