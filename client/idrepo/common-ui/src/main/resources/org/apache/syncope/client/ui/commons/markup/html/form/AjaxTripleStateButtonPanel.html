<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
<wicket:extend>
  <div class="tristate-field">
    <div class="tristate-field-label-row">
      <wicket:enclosure child="field-label">
        <span class="form-label" wicket:id="field-label">[LABEL]</span><span wicket:id="required"/>
      </wicket:enclosure>
      <span wicket:id="externalAction" class="tristate-external-action"/>
    </div>

    <div wicket:id="tripleStateField" class="btn-group tristate-icon-group" role="radiogroup">
      <input type="radio" wicket:id="trueOption" class="btn-check" autocomplete="off"/>
      <label wicket:id="trueLabel" class="btn btn-outline-secondary tristate-option tristate-true">
        <i class="fa-solid fa-check" aria-hidden="true"></i>
        <span class="visually-hidden"><wicket:message key="tristate.true">True</wicket:message></span>
      </label>

      <wicket:container wicket:id="unsetContainer">
        <input type="radio" wicket:id="unsetOption" class="btn-check" autocomplete="off"/>
        <label wicket:id="unsetLabel" class="btn btn-outline-secondary tristate-option tristate-unset">
          <i class="fa-solid fa-minus" aria-hidden="true"></i>
          <span class="visually-hidden"><wicket:message key="tristate.unset">Unset</wicket:message></span>
        </label>
      </wicket:container>

      <input type="radio" wicket:id="falseOption" class="btn-check" autocomplete="off"/>
      <label wicket:id="falseLabel" class="btn btn-outline-secondary tristate-option tristate-false">
        <i class="fa-solid fa-x" aria-hidden="true"></i>
        <span class="visually-hidden"><wicket:message key="tristate.false">False</wicket:message></span>
      </label>
    </div>
  </div>
</wicket:extend>
</html>
